services:
  meridian:
    build:
      context: .
      dockerfile: Dockerfile
    image: meridian:local
    container_name: meridian
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /workspace
    command: ["node", "index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: meridian_node_modules
        target: /opt/meridian-node_modules
    stop_grace_period: 45s
    mem_limit: 1024m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  meridian_node_modules:
